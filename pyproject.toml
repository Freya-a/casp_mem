[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casp-mem"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "openai>=1.90,<2", "qdrant-client>=1.9", "transformers>=4.51", "torch", "sentence-transformers>=5"]

[tool.setuptools.packages.find]
include = ["casp_mem*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
